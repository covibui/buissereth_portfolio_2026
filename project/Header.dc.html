<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:20px 48px; background:var(--paper,#F4F1EA); border-bottom:1px solid var(--hair,rgba(28,26,23,.14)); backdrop-filter:saturate(1.1); box-sizing:border-box;">
  <a href="Portfolio.dc.html" style="text-decoration:none; display:flex; align-items:center; gap:11px; color:var(--ink,#1C1A17);">
    <img src="assets/mark.png" alt="Brianna Buissereth" width="26" height="26" style="display:block; flex:none;">
    <span style="font-family:'Newsreader',serif; font-weight:500; font-size:21px; letter-spacing:-.01em;">Brianna Buissereth</span>
    <span style="font-family:'Archivo',sans-serif; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted,#6B675F); font-weight:600;">Design&nbsp;Strategy</span>
  </a>
  <nav style="display:flex; align-items:center; gap:30px; font-family:'Archivo',sans-serif; font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:600;">
    <a href="Work.dc.html" style="text-decoration:none; color:var(--ink,#1C1A17); padding-bottom:3px; border-bottom:2px solid {{ uWork }};">Work</a>
    <a href="Personal.dc.html" style="text-decoration:none; color:var(--ink,#1C1A17); padding-bottom:3px; border-bottom:2px solid {{ uPersonal }};">Personal</a>
    <a href="Resume.dc.html" style="text-decoration:none; color:var(--ink,#1C1A17); padding-bottom:3px; border-bottom:2px solid {{ uResume }};">Résumé</a>
    <a href="mailto:covibui@gmail.com" style="text-decoration:none; color:var(--paper,#F4F1EA); background:var(--ink,#1C1A17); padding:9px 16px; border-radius:999px; letter-spacing:.12em;" style-hover="background:var(--accent,#EA580C);">Contact</a>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:68},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;work&quot;,&quot;personal&quot;,&quot;resume&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "";
    const on = "var(--accent,#EA580C)";
    const off = "transparent";
    return {
      uWork: a === "work" ? on : off,
      uPersonal: a === "personal" ? on : off,
      uResume: a === "resume" ? on : off,
    };
  }
}
</script>
</body>
</html>
