<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Newsreader, Georgia, 'Times New Roman', serif">
  <!-- The source diagram from Claude Design references these classes but ships no
       stylesheet; an SVG embedded through img cannot inherit the page CSS, so the
       definitions are inlined here from the site's design tokens. -->
  <style>
    .line{fill:none;stroke:#E2DCD2;stroke-width:1}
    .hair{fill:none;stroke:rgba(28,26,23,.28);stroke-width:1}
    .flow{fill:none;stroke:#6B675F;stroke-width:1.5}
    .flowa{fill:none;stroke:#EA580C;stroke-width:1.5;stroke-dasharray:6 4}
    .ink{fill:#1C1A17}
    .muted{fill:#6B675F}
    .acc{fill:#EA580C}
    .lbl{font-family:Archivo,system-ui,sans-serif;font-weight:600;letter-spacing:.14em}
    .ttl{font-weight:400}
    .fld{font-weight:400}
    .it{font-style:italic}
  </style>
  <defs>

    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B675F"></path></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"></path></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#F4F1EA"></rect>

  <text class="lbl acc" x="60" y="70" font-size="13">Del Buico Kitchen · proposed v2 architecture</text>
  <text class="ttl ink" x="60" y="124" font-size="42">Design the contribution, not the website.</text>
  <line class="hair" x1="60" y1="156" x2="1540" y2="156"></line>
  <text class="fld muted" x="60" y="186" font-size="15">Proposal only. Nothing below is built. Dashed orange marks capability that did not exist in v1 and would have to be earned.</text>


  <text class="lbl muted" x="60" y="252" font-size="11">01 · Who contributes</text>
  <text class="lbl muted" x="470" y="252" font-size="11">02 · How it gets in</text>
  <text class="lbl muted" x="960" y="252" font-size="11">03 · Where it lives</text>
  <text class="lbl muted" x="1300" y="252" font-size="11">04 · How it comes out</text>


  <rect x="60" y="272" width="330" height="86" rx="10" fill="#FFFFFF"></rect><rect class="line" x="60" y="272" width="330" height="86" rx="10"></rect>
  <text class="ttl ink" x="84" y="312" font-size="21">The relative</text>
  <text class="fld muted" x="84" y="338" font-size="13.5">On a phone, in a kitchen, once a year</text>

  <rect x="60" y="376" width="330" height="86" rx="10" fill="#FFFFFF"></rect><rect class="line" x="60" y="376" width="330" height="86" rx="10"></rect>
  <text class="ttl ink" x="84" y="416" font-size="21">The archivist</text>
  <text class="fld muted" x="84" y="442" font-size="13.5">One person. Not a dependency.</text>

  <rect x="60" y="480" width="330" height="86" rx="10" fill="#FFFFFF"></rect><rect class="line" x="60" y="480" width="330" height="86" rx="10"></rect>
  <text class="ttl ink" x="84" y="520" font-size="21">The index card</text>
  <text class="fld muted" x="84" y="546" font-size="13.5">Paper that nobody will retype</text>


  <rect x="470" y="272" width="410" height="150" rx="10" fill="#FFFFFF"></rect><rect class="line" x="470" y="272" width="410" height="150" rx="10"></rect>
  <text class="lbl muted" x="494" y="302" font-size="11">Primary</text>
  <text class="ttl ink" x="494" y="336" font-size="21">Structured entry form</text>
  <text class="fld muted" x="494" y="362" font-size="13.5">Qty + unit + item rows. One instruction</text>
  <text class="fld muted" x="494" y="384" font-size="13.5">per step. Autosaving draft. One free field:</text>
  <text class="fld acc" x="494" y="406" font-size="13.5">the margin note — the good part, kept.</text>

  <rect x="470" y="440" width="410" height="126" rx="10" fill="#FFFFFF"></rect><rect class="line" x="470" y="440" width="410" height="126" rx="10" stroke="#EA580C" stroke-dasharray="6 4"></rect>
  <text class="lbl acc" x="494" y="470" font-size="11">Proposed · AI assist</text>
  <text class="ttl ink" x="494" y="504" font-size="21">Card scan → draft</text>
  <text class="fld muted" x="494" y="530" font-size="13.5">Photograph the handwriting; transcription</text>
  <text class="fld muted" x="494" y="552" font-size="13.5">prefills the fields. A person confirms. Always.</text>

  <rect x="470" y="584" width="410" height="126" rx="10" fill="#FFFFFF"></rect><rect class="line" x="470" y="584" width="410" height="126" rx="10" stroke="#EA580C" stroke-dasharray="6 4"></rect>
  <text class="lbl acc" x="494" y="614" font-size="11">Proposed · AI assist</text>
  <text class="ttl ink" x="494" y="648" font-size="21">Paste → steps</text>
  <text class="fld muted" x="494" y="674" font-size="13.5">A pasted wall of text is split into steps and</text>
  <text class="fld muted" x="494" y="696" font-size="13.5">flagged for contradictions before it is saved.</text>


  <rect x="960" y="272" width="290" height="180" rx="10" fill="#FFFFFF"></rect><rect class="line" x="960" y="272" width="290" height="180" rx="10"></rect>
  <text class="lbl muted" x="984" y="302" font-size="11">Content store</text>
  <text class="ttl ink" x="984" y="336" font-size="21">Git + media</text>
  <text class="fld muted" x="984" y="364" font-size="13.5">One typed record per recipe,</text>
  <text class="fld muted" x="984" y="386" font-size="13.5">plus the scan of the original.</text>
  <text class="fld muted" x="984" y="414" font-size="13.5">Plain files. Readable in 30 years</text>
  <text class="fld muted" x="984" y="436" font-size="13.5">by something that isn't this app.</text>

  <rect x="960" y="470" width="290" height="150" rx="10" fill="#FFFFFF"></rect><rect class="line" x="960" y="470" width="290" height="150" rx="10" stroke="#EA580C" stroke-dasharray="6 4"></rect>
  <text class="lbl acc" x="984" y="500" font-size="11">Proposed</text>
  <text class="ttl ink" x="984" y="534" font-size="21">People index</text>
  <text class="fld muted" x="984" y="562" font-size="13.5">Who taught it, who cooks it,</text>
  <text class="fld muted" x="984" y="584" font-size="13.5">when it was last made. The</text>
  <text class="fld muted" x="984" y="606" font-size="13.5">archive stops being anonymous.</text>


  <rect x="1300" y="272" width="240" height="104" rx="10" fill="#FFFFFF"></rect><rect class="line" x="1300" y="272" width="240" height="104" rx="10"></rect>
  <text class="ttl ink" x="1324" y="310" font-size="20">The book, online</text>
  <text class="fld muted" x="1324" y="336" font-size="13.5">Chapters, not 24 bins.</text>
  <text class="fld muted" x="1324" y="358" font-size="13.5">Named invite, not a password.</text>

  <rect x="1300" y="394" width="240" height="104" rx="10" fill="#FFFFFF"></rect><rect class="line" x="1300" y="394" width="240" height="104" rx="10"></rect>
  <text class="ttl ink" x="1324" y="432" font-size="20">Cook mode</text>
  <text class="fld muted" x="1324" y="458" font-size="13.5">Scaled quantities, one step</text>
  <text class="fld muted" x="1324" y="480" font-size="13.5">at a time, floury thumbs.</text>

  <rect x="1300" y="516" width="240" height="104" rx="10" fill="#FFFFFF"></rect><rect class="line" x="1300" y="516" width="240" height="104" rx="10" stroke="#EA580C" stroke-dasharray="6 4"></rect>
  <text class="ttl ink" x="1324" y="554" font-size="20">Print the book</text>
  <text class="fld muted" x="1324" y="580" font-size="13.5">The exit. Paper that survives</text>
  <text class="fld acc" x="1324" y="602" font-size="13.5">a lapsed domain.</text>


  <path class="flow" d="M390,315 L470,330" marker-end="url(#a1)"></path>
  <path class="flow" d="M390,419 L470,360" marker-end="url(#a1)"></path>
  <path class="flowa" d="M390,523 L470,503" marker-end="url(#a2)"></path>
  <path class="flow" d="M880,347 L960,347" marker-end="url(#a1)"></path>
  <path class="flowa" d="M880,503 L960,400" marker-end="url(#a2)"></path>
  <path class="flowa" d="M880,647 L960,430" marker-end="url(#a2)"></path>
  <path class="flow" d="M1250,330 L1300,324" marker-end="url(#a1)"></path>
  <path class="flow" d="M1250,380 L1300,440" marker-end="url(#a1)"></path>
  <path class="flow" d="M1250,430 L1300,560" marker-end="url(#a1)"></path>


  <rect x="60" y="756" width="1480" height="196" rx="10" fill="#1C1A17"></rect>
  <text class="lbl" x="88" y="794" font-size="11" fill="#EA580C">The constraint that shaped v1 — and the rule that has to survive it</text>
  <text class="fld" x="88" y="832" font-size="15" fill="#F4F1EA">Everything here has to run on a free tier, because that was the budget and it still is. In v1 the free tier chose the product:</text>
  <text class="fld" x="88" y="860" font-size="15" fill="#F4F1EA">a git-backed CMS was what we could get, so a git-backed CMS's default fields became the content model, and the content</text>
  <text class="fld" x="88" y="888" font-size="15" fill="#F4F1EA">model became three text boxes with no opinion. The stack picked the schema. That is the actual failure.</text>
  <text class="fld it" x="88" y="928" font-size="15" fill="#EA580C">Rule for v2: the model is designed first and every proposed feature must degrade to plain files and a static page when the free tier withdraws.</text>
</svg>
